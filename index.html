<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Start</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell">
      <div class="top-actions">
        <a class="icon-button converter-button" href="converter.html" aria-label="打开转换工具" title="转换工具">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
            <path d="M14 2v6h6"></path>
            <path d="m10 13-2 2 2 2"></path>
            <path d="m14 17 2-2-2-2"></path>
          </svg>
        </a>
        <button class="icon-button background-button" id="backgroundButton" type="button" aria-label="设置背景">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <circle cx="8.5" cy="10" r="1.5"></circle>
            <path d="m21 15-4.5-4.5L7 20"></path>
          </svg>
        </button>
        <button class="icon-button edit-mode-button" id="editModeButton" type="button" aria-label="进入编辑模式">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </button>
      </div>

      <div class="edit-toolbar" id="editToolbar" hidden>
        <button class="toolbar-button done-button" id="doneEditButton" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
          完成
        </button>
        <label class="secondary-button file-button toolbar-button" for="importConfigInput">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 3v12"></path>
            <path d="m7 8 5-5 5 5"></path>
            <path d="M5 21h14"></path>
          </svg>
          导入配置
        </label>
        <input class="visually-hidden" id="importConfigInput" type="file" accept="application/json,.json">
        <button class="secondary-button toolbar-button" id="exportConfigButton" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 21V9"></path>
            <path d="m7 16 5 5 5-5"></path>
            <path d="M5 3h14"></path>
          </svg>
          导出配置
        </button>
      </div>

      <main class="start-panel" aria-labelledby="pageTitle">
        <p class="eyebrow">Personal Start</p>
        <h1 id="pageTitle">My Start</h1>

        <form class="search-form" id="searchForm" role="search">
          <label class="visually-hidden" for="searchInput">搜索网站或输入关键词</label>
          <div class="search-box" id="searchBox">
            <button class="search-engine-button" id="searchEngineButton" type="button" aria-label="切换搜索引擎" aria-expanded="false">
              <img id="searchEngineIcon" src="" alt="">
            </button>
            <div class="search-engine-menu" id="searchEngineMenu" hidden></div>
            <input id="searchInput" type="search" autocomplete="off" placeholder="搜索网站、关键词，或粘贴 JSON...">
          </div>
        </form>

        <nav class="group-tabs" id="groupTabs" aria-label="导航分组"></nav>

        <section class="site-section" id="siteSection" aria-live="polite">
          <section class="json-panel" id="jsonPanel" hidden>
            <header class="json-panel-header">
              <span id="jsonPanelTitle">JSON</span>
              <button class="json-copy-button" id="copyJsonButton" type="button">复制</button>
            </header>
            <pre class="json-output"><code id="jsonOutput"></code></pre>
          </section>
          <div class="site-grid" id="siteGrid"></div>
          <p class="empty-state" id="emptyState" hidden></p>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden></div>

    <section class="edit-modal" id="editModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle" hidden>
      <header class="modal-header">
        <div>
          <p class="eyebrow">Edit</p>
          <h2 id="modalTitle">编辑</h2>
        </div>
        <button class="icon-button" id="closeModalButton" type="button" aria-label="关闭弹窗">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </header>

      <form class="modal-form" id="groupForm" hidden>
        <input id="groupIdInput" type="hidden">

        <label for="groupNameInput">分组名称</label>
        <input id="groupNameInput" type="text" maxlength="16" placeholder="例如：工作" required>

        <div class="modal-actions">
          <button class="primary-button" type="submit">保存分组</button>
          <button class="danger-button" id="deleteGroupButton" type="button" hidden>删除分组</button>
        </div>
      </form>

      <form class="modal-form" id="siteForm" hidden>
        <input id="siteIdInput" type="hidden">

        <label for="siteGroupInput">所属分组</label>
        <select id="siteGroupInput" required></select>

        <label for="siteNameInput">网页名称</label>
        <input id="siteNameInput" type="text" maxlength="32" placeholder="例如：GitHub" required>

        <label for="siteUrlInput">网页链接</label>
        <input id="siteUrlInput" type="text" placeholder="https://github.com" required>

        <label for="siteIconInput">图标链接</label>
        <div class="input-action-row">
          <input id="siteIconInput" type="text" placeholder="可选，留空会显示首字母">
          <button class="secondary-button inline-action-button" id="fetchSiteIconButton" type="button">获取图标</button>
        </div>

        <div class="modal-actions">
          <button class="primary-button" type="submit">保存网页</button>
        </div>
      </form>

      <form class="modal-form background-form" id="backgroundForm" hidden>
        <label>背景样式</label>
        <div class="background-choices" role="radiogroup" aria-label="背景样式">
          <button class="background-choice" data-background-choice="white" type="button" role="radio">
            <span class="background-swatch background-swatch-white"></span>
            <span>白色</span>
          </button>
          <button class="background-choice" data-background-choice="black" type="button" role="radio">
            <span class="background-swatch background-swatch-black"></span>
            <span>黑色</span>
          </button>
          <button class="background-choice" data-background-choice="image" type="button" role="radio">
            <span class="background-swatch background-swatch-image"></span>
            <span>图片</span>
          </button>
        </div>

        <div class="background-preview" id="backgroundPreview" aria-hidden="true">
          <span id="backgroundPreviewText">未选择图片</span>
        </div>

        <input class="visually-hidden" id="backgroundImageInput" type="file" accept="image/*">

        <div class="background-upload-actions">
          <button class="secondary-button" id="uploadBackgroundImageButton" type="button">选择图片</button>
          <button class="secondary-button" id="clearBackgroundImageButton" type="button">移除图片</button>
        </div>

        <div class="modal-actions">
          <button class="primary-button" type="submit">保存背景</button>
        </div>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toastMessage"></span>
      <button id="toastAction" type="button" hidden></button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
