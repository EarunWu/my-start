<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Session 转换 - My Start</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell converter-shell">
      <a class="brand" href="index.html" aria-label="My Start 首页"><img class="brand-mark" src="assets/logo.svg" alt="" width="38" height="38" aria-hidden="true"><span>my start<span class="brand-dot">.</span></span></a>
      <div class="top-actions">
        <a class="icon-button" href="index.html" aria-label="返回起始页" title="返回起始页">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m12 19-7-7 7-7"></path>
            <path d="M19 12H5"></path>
          </svg>
        </a>
      </div>

      <main class="converter-panel" aria-labelledby="converterTitle">
        <div class="tool-label">MY START / 小工具</div>
        <p class="eyebrow">LESS FRICTION, MORE FLOW</p>
        <h1 id="converterTitle">Session 转换</h1>
        <p class="hero-description">粘贴、转换、带走。让繁琐的格式整理简单一点。</p>

        <form class="converter-grid" id="converterForm">
          <section class="converter-column" aria-labelledby="sessionInputTitle">
            <header class="converter-column-header">
              <h2 id="sessionInputTitle"><span class="step-number">01</span> 输入</h2>
              <span>粘贴文本或选择文件</span>
            </header>

            <label class="visually-hidden" for="sessionInput">Session JSON 文本</label>
            <textarea
              class="converter-textarea"
              id="sessionInput"
              spellcheck="false"
              placeholder="在这里粘贴 Session JSON 文本…"
            ></textarea>

            <input class="visually-hidden" id="sessionFileInput" type="file" accept=".txt,.json,application/json,text/plain">
            <div class="converter-actions">
              <label class="secondary-button file-button converter-file-button" for="sessionFileInput">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 3v12"></path>
                  <path d="m7 8 5-5 5 5"></path>
                  <path d="M5 21h14"></path>
                </svg>
                选择文件
              </label>
              <button class="primary-button" id="convertButton" type="submit">转换</button>
              <button class="secondary-button" id="clearConverterButton" type="button">清空</button>
            </div>
            <p class="converter-file-name" id="sessionFileName" aria-live="polite"></p>
          </section>

          <section class="converter-column" aria-labelledby="convertedOutputTitle">
            <header class="converter-column-header">
              <h2 id="convertedOutputTitle"><span class="step-number">02</span> 输出</h2>
              <span id="converterStatus" aria-live="polite">等待转换</span>
            </header>

            <pre class="json-output converter-output"><code id="convertedOutput"></code></pre>

            <div class="converter-actions">
              <button class="secondary-button" id="copyConvertedButton" type="button" disabled>复制</button>
              <button class="primary-button" id="downloadConvertedButton" type="button" disabled>下载 JSON</button>
            </div>
            <p class="converter-file-name" aria-hidden="true"></p>
          </section>
        </form>
      </main>
      <footer class="page-footer"><span><i aria-hidden="true"></i> 转换在浏览器本地完成</span><a href="index.html">返回我的导航 ↗</a></footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toastMessage"></span>
      <button id="toastAction" type="button" hidden></button>
    </div>

    <script src="session-converter.js"></script>
    <script src="converter-page.js"></script>
  </body>
</html>
